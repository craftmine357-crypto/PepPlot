const MS_POR_DIA = 1000 * 60 * 60 * 24;
const somarDias = (data, dias) => new Date(data.getTime() + dias * MS_POR_DIA);
const diferencaEmDias = (inicio, fim) => Math.round(((fim.getTime() - inicio.getTime()) / MS_POR_DIA) * 1000) / 1000;
const truncarParaDia = (data) => {
  const d = new Date(data);
  d.setHours(0, 0, 0, 0);
  return d;
};
const mesmoDia = (a, b) => truncarParaDia(a).getTime() === truncarParaDia(b).getTime();

const arredondar2 = (n) => Math.round(n * 100) / 100;
const arredondar1 = (n) => Math.round(n * 10) / 10;
/**
 * Peso vigente em uma data: usa o registro mais recente ANTERIOR ou IGUAL à data.
 * Se a data for anterior ao primeiro registro, usa o primeiro (não há dado melhor).
 * `pesos` deve vir ordenado por data crescente.
 */
function pesoNaData(pesos, data, padrao = 70) {
  if (!pesos || pesos.length === 0) return padrao;
  let vigente = pesos[0].valorKg;
  for (const p of pesos) {
    if (p.data <= data) vigente = p.valorKg;
    else break;
  }
  return vigente;
}

/** Combina a data programada com o horário do composto, para o countdown ter hora certa. */
function momentoAplicacao(agendamento) {
  const [h, m] = String(agendamento.horario || "08:00").split(":").map(Number);
  const d = truncarParaDia(agendamento.dataProgramada);
  d.setHours(h || 0, m || 0, 0, 0);
  return d;
}

/** Formata a distância até uma data como "2d 5h 13m" (ou "5h 13m 08s" quando falta menos de um dia). */
function formatarTempoRestante(ms) {
  const abs = Math.abs(ms);
  const dias = Math.floor(abs / 86400000);
  const horas = Math.floor((abs % 86400000) / 3600000);
  const min = Math.floor((abs % 3600000) / 60000);
  const seg = Math.floor((abs % 60000) / 1000);
  if (dias > 0) return `${dias}d ${horas}h ${min}m`;
  if (horas > 0) return `${horas}h ${min}m ${String(seg).padStart(2, "0")}s`;
  return `${min}m ${String(seg).padStart(2, "0")}s`;
}
const formatarNumeroBR = (n) => (Number(n) || 0).toLocaleString("pt-BR", { maximumFractionDigits: 1, minimumFractionDigits: 0 });
const converterParaMcg = (valor, unidade) => (unidade === "mg" ? Number(valor) * 1000 : Number(valor));
const formatarBRL = (n) => (Number(n) || 0).toFixed(2).replace(".", ",");
const parseValorMonetario = (str) => parseFloat(String(str).replace(",", ".")) || 0;

/** Escolhe texto claro ou escuro automaticamente conforme a luminância do fundo — evita texto ilegível em cores dinâmicas (ex: âmbar claro). */
function corTextoContraste(hex) {
  const c = String(hex).replace("#", "");
  if (c.length !== 6) return COR.textoPrincipal;
  const r = parseInt(c.substring(0, 2), 16);
  const g = parseInt(c.substring(2, 4), 16);
  const b = parseInt(c.substring(4, 6), 16);
  const luminancia = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminancia > 0.6 ? "#0E1013" : "#F5F6F7";
}

// ============================================================================
// GERAÇÃO DE AGENDA / ITEM
// ============================================================================
function gerarAgendamentoItem(item) {
  const duracaoDias = item.duracaoSemanas * 7;
  const dataInicio = truncarParaDia(item.dataInicio);
  const agendamentos = [];

  const incluirDia = (offset) => {
    if (item.frequencia.tipo === "intervalo") return offset % item.frequencia.valor === 0;
    return item.frequencia.valor.includes(somarDias(dataInicio, offset).getDay());
  };

  for (let offset = 0; offset <= duracaoDias; offset++) {
    if (!incluirDia(offset)) continue;
    const dataProgramada = somarDias(dataInicio, offset);
    agendamentos.push({
      id: `${item.id}-${dataProgramada.getTime()}`,
      itemId: item.id,
      dataProgramada,
      dose: item.dose,
      unidade: item.unidade,
      doseExibicao: item.doseExibicao ?? item.dose,
      unidadeExibicao: item.unidadeExibicao ?? item.unidade,
      meiaVidaDias: item.meiaVidaDias,
      fracao: item.fracao ?? 1,
      meiaVidaAbsorcao: item.meiaVidaAbsorcao ?? null,
      fatorCalibracao: item.fatorCalibracao ?? 1,
      compostoNome: item.compostoNome,
      realizada: false,
      dataReal: null,
      sitio: null,
      horario: item.horario || "08:00",
    });
  }
  return agendamentos;
}

function criarItem(config) {
  const item = { ...config };
  return { ...item, agendamentos: gerarAgendamentoItem(item) };
}

function atualizarCamposItem(itens, itemId, campos) {
  return itens.map((it) => {
    if (it.id !== itemId) return it;
    const atualizado = { ...it, ...campos };
    // o horário vive também em cada agendamento (usado no countdown) — propaga
    // apenas para as doses ainda não confirmadas, preservando o histórico real
    if (campos.horario) {
      atualizado.agendamentos = it.agendamentos.map((a) => (a.realizada ? a : { ...a, horario: campos.horario }));
    }
    return atualizado;
  });
}

function excluirItem(itens, itemId) {
  return itens.filter((it) => it.id !== itemId);
}

/**
 * Atualiza dose e/ou frequência de um item PRESERVANDO o histórico: doses já
 * confirmadas (ou já vencidas) permanecem exatamente como aconteceram; apenas
 * as doses futuras ainda não confirmadas são descartadas e regeneradas com o
 * novo protocolo, a partir de hoje até a data original de término do ciclo.
 */
function atualizarProtocoloItem(itens, itemId, novosCampos) {
  return itens.map((item) => {
    if (item.id !== itemId) return item;
    const itemMesclado = { ...item, ...novosCampos };
    const agendamentosPreservados = item.agendamentos.filter((a) => a.realizada || a.dataProgramada < HOJE);

    const dataFimOriginal = somarDias(truncarParaDia(item.dataInicio), item.duracaoSemanas * 7);
    const semanasRestantes = Math.max(diferencaEmDias(HOJE, dataFimOriginal) / 7, 0);

    const itemTemporario = { ...itemMesclado, dataInicio: HOJE, duracaoSemanas: semanasRestantes };
    const novosAgendamentos = gerarAgendamentoItem(itemTemporario).filter((a) => a.dataProgramada >= HOJE);

    return {
      ...itemMesclado,
      agendamentos: [...agendamentosPreservados, ...novosAgendamentos].sort((a, b) => a.dataProgramada - b.dataProgramada),
    };
  });
}

/** Percentual de doses já vencidas que foram de fato confirmadas — inclui todos os itens do ciclo. */
function calcularAderenciaCiclo(itens, hoje) {
  const todas = itens.flatMap((it) => it.agendamentos).filter((a) => a.dataProgramada <= hoje);
  if (todas.length === 0) return null;
  const feitas = todas.filter((a) => a.realizada).length;
  return Math.round((feitas / todas.length) * 100);
}

// ============================================================================
// MOTOR MATEMÁTICO — peptídeos (linha única) e hormônios (multi-grupo)
// ============================================================================
function gerarDadosGrafico(itens, hoje) {
  const todosAgendamentos = itens.flatMap((it) => it.agendamentos);
  if (todosAgendamentos.length === 0) return [];

  const inicioGlobal = truncarParaDia(
    todosAgendamentos.reduce((menor, a) => (a.dataProgramada < menor ? a.dataProgramada : menor), todosAgendamentos[0].dataProgramada)
  );
  const fimGlobal = todosAgendamentos.reduce((maior, a) => (a.dataProgramada > maior ? a.dataProgramada : maior), todosAgendamentos[0].dataProgramada);
  const duracaoDias = Math.ceil(diferencaEmDias(inicioGlobal, fimGlobal)) + 14;

  const pontos = [];
  for (let offset = 0; offset <= duracaoDias; offset++) {
    const diaAtual = somarDias(inicioGlobal, offset);
    let prevista = 0;
    for (const a of todosAgendamentos) {
      const t = diferencaEmDias(a.dataProgramada, diaAtual);
      if (t < 0) continue;
      prevista += a.dose * Math.pow(0.5, t / a.meiaVidaDias);
    }
    let real = 0;
    for (const a of todosAgendamentos) {
      if (!a.realizada || !a.dataReal) continue;
      const t = diferencaEmDias(a.dataReal, diaAtual);
      if (t < 0) continue;
      real += a.dose * Math.pow(0.5, t / a.meiaVidaDias);
    }
    pontos.push({ dia: diaAtual, offset, prevista: arredondar1(prevista), real: diaAtual <= hoje ? arredondar1(real) : null, label: formatarDataCurta(diaAtual) });
  }
  return pontos;
}

function computeDadosVisiveis(pontosGrafico, periodo, hoje) {
  if (pontosGrafico.length === 0) return { dados: [], indiceHoje: -1 };
  const indiceHoje = pontosGrafico.findIndex((p) => mesmoDia(p.dia, hoje));
  if (periodo === null) return { dados: pontosGrafico, indiceHoje };
  const janelaDias = periodo * 7;
  const inicio = Math.max(0, indiceHoje - janelaDias);
  // Antes o lado futuro ficava travado em +7 dias fixos, não importa o período
  // escolhido — por isso "12 semanas" ou "Tudo" pareciam mostrar só algumas
  // semanas. Agora o futuro também escala com o período selecionado.
  const fim = Math.min(pontosGrafico.length - 1, indiceHoje + janelaDias);
  const dados = pontosGrafico.slice(inicio, fim + 1).map((p, i, arr) => ({ ...p, isUltimoReal: p.real != null && (arr[i + 1]?.real == null || i === arr.length - 1) }));
  return { dados, indiceHoje };
}

/** Agrupa itens de hormônio conforme o modo: 'sobrepor' (por tipo) ou 'comparar' (cada item separado). */
function agruparItensHormonio(itens, modo) {
  if (modo === "comparar") {
    const contagemPorTipo = {};
    return itens.map((it) => {
      const tipo = it.tipoHormonio || it.compostoNome;
      const corPadraoTipo = PALETA_TIPOS_HORMONIO[tipo];
      const indice = contagemPorTipo[tipo] ?? 0;
      contagemPorTipo[tipo] = indice + 1;
      const corFinal = it.cor && it.cor !== corPadraoTipo ? it.cor : PALETA_SELECIONAVEL[indice % PALETA_SELECIONAVEL.length].cor;
      return { chave: it.id, nome: it.compostoNome, cor: corFinal, itens: [it] };
    });
  }
  const grupos = {};
  itens.forEach((it) => {
    const chave = it.tipoHormonio || it.compostoNome;
    if (!grupos[chave]) grupos[chave] = { chave, nome: chave, cor: PALETA_TIPOS_HORMONIO[chave] || it.cor || COR.acentoReal, itens: [] };
    grupos[chave].itens.push(it);
  });
  return Object.values(grupos);
}

/**
 * Concentração no modelo de Bateman (absorção de 1ª ordem + eliminação de 1ª ordem).
 * Sobe gradualmente até um pico (quando ka e ke se cruzam) e só então decai —
 * diferente do decaimento exponencial simples que assumia pico instantâneo no dia 0.
 */
function calcularBateman(doseMg, ka, ke, t) {
  if (t < 0) return 0;
  if (Math.abs(ka - ke) < 1e-6) return 0; // evita divisão por zero (não ocorre com os pares ka/ke do catálogo)
  const acumulacao = Math.exp(-ke * t) - Math.exp(-ka * t);
  return ((doseMg * ka) / (ka - ke)) * acumulacao;
}

/**
 * Soma a curva de Bateman de todas as doses de cada grupo, ponderada por:
 *  - `fracao`: fração de massa do éster que é hormônio ativo (razão de peso
 *    molecular testosterona/éster — ex: Enantato ≈ 0,72).
 *  - `fatorPeso`: ajuste relativo simples pelo peso corporal, usando 70kg como
 *    referência.
 * O resultado é convertido para uma estimativa de ng/dL usando um fator empírico
 * calibrado para o Undecanoato de Testosterona (1000mg → pico ~1150 ng/dL entre
 * os dias 7 e 14) e uma linha de base fisiológica (~300 ng/dL) antes de qualquer
 * aplicação. Isso ainda é uma ESTIMATIVA para visualização, não um resultado de
 * exame de sangue — não substitui dosagem laboratorial real.
 */
function gerarDadosGraficoMultiGrupo(grupos, hoje, pesoCorporal = 70) {
  // `pesoCorporal` pode ser um número (peso único) ou um histórico [{data, valorKg}].
  // Com histórico, cada dia do gráfico usa o peso vigente naquela data — o volume
  // de distribuição acompanha o peso da época, não o peso atual.
  const historicoPesos = Array.isArray(pesoCorporal) ? pesoCorporal : null;
  const todosAgendamentos = grupos.flatMap((g) => g.itens.flatMap((it) => it.agendamentos));
  if (todosAgendamentos.length === 0) return [];
  const inicioGlobal = truncarParaDia(todosAgendamentos.reduce((menor, a) => (a.dataProgramada < menor ? a.dataProgramada : menor), todosAgendamentos[0].dataProgramada));
  const fimGlobal = todosAgendamentos.reduce((maior, a) => (a.dataProgramada > maior ? a.dataProgramada : maior), todosAgendamentos[0].dataProgramada);
  const duracaoDias = Math.ceil(diferencaEmDias(inicioGlobal, fimGlobal)) + 21;
  const fatorPesoFixo = historicoPesos ? null : 70 / Math.max(Number(pesoCorporal) || 70, 30);

  const pontos = [];
  for (let offset = 0; offset <= duracaoDias; offset++) {
    const diaAtual = somarDias(inicioGlobal, offset);
    const fatorPeso = fatorPesoFixo ?? 70 / Math.max(pesoNaData(historicoPesos, diaAtual, 70), 30);
    const ponto = { dia: diaAtual, offset, label: formatarDataCurta(diaAtual) };
    grupos.forEach((g) => {
      const agsGrupo = g.itens.flatMap((it) => it.agendamentos);

      let massaPrevista = 0;
      agsGrupo.forEach((a) => {
        const t = diferencaEmDias(a.dataProgramada, diaAtual);
        const ke = Math.log(2) / a.meiaVidaDias;
        const ka = Math.log(2) / (a.meiaVidaAbsorcao || a.meiaVidaDias / 4.2);
        massaPrevista += calcularBateman(a.dose, ka, ke, t) * (a.fracao ?? 1) * (a.fatorCalibracao ?? 1);
      });

      let massaReal = 0;
      agsGrupo.forEach((a) => {
        if (!a.realizada || !a.dataReal) return;
        const t = diferencaEmDias(a.dataReal, diaAtual);
        const ke = Math.log(2) / a.meiaVidaDias;
        const ka = Math.log(2) / (a.meiaVidaAbsorcao || a.meiaVidaDias / 4.2);
        massaReal += calcularBateman(a.dose, ka, ke, t) * (a.fracao ?? 1) * (a.fatorCalibracao ?? 1);
      });

      ponto[`${g.chave}_prevista`] = arredondar1(massaPrevista * fatorPeso * FATOR_ESCALA_NGDL);
      ponto[`${g.chave}_real`] = diaAtual <= hoje ? arredondar1(massaReal * fatorPeso * FATOR_ESCALA_NGDL) : null;
    });
    pontos.push(ponto);
  }
  return pontos;
}

// ============================================================================
// CÁLCULOS DE CUSTO E RECONSTITUIÇÃO
// ============================================================================
function obterCapacidadeFrasco(item) {
  if (item.categoria === "hormonio") return (item.volumeFrascoMl || 0) * (item.concentracaoMgMl || 0);
  return (item.vialMg || 0) * 1000;
}

function calcularCustoItem(item) {
  const capacidade = obterCapacidadeFrasco(item);
  if (!capacidade || !item.custoPorFrasco) return null;
  const custoPorUnidade = item.custoPorFrasco / capacidade;
  const custoPorDose = item.dose * custoPorUnidade;
  const totalUnidadeCiclo = item.dose * item.agendamentos.length;
  const frascosNecessarios = Math.max(1, Math.ceil(totalUnidadeCiclo / capacidade));
  return { custoPorDose: arredondar2(custoPorDose), frascosNecessarios, custoTotalCiclo: arredondar2(frascosNecessarios * item.custoPorFrasco) };
}

/**
 * Estoque restante e previsão de esgotamento (run-out), a partir de quantos
 * frascos/ampolas o usuário tem comprados e de quantas doses já foram de fato
 * aplicadas (apenas `realizada`, não o plano inteiro).
 */
function calcularEstoqueItem(item) {
  const capacidade = obterCapacidadeFrasco(item);
  if (!capacidade || !item.frascosComprados) return null;

  const estoqueTotalUnidade = item.frascosComprados * capacidade;
  const dosesRealizadas = item.agendamentos.filter((a) => a.realizada).length;
  const unidadeConsumida = dosesRealizadas * item.dose;
  const unidadeRestante = Math.max(estoqueTotalUnidade - unidadeConsumida, 0);
  const dosesRestantesEstoque = item.dose > 0 ? Math.floor(unidadeRestante / item.dose) : 0;

  // Estima o intervalo médio entre aplicações a partir do próprio agendamento,
  // para projetar a data de esgotamento (em vez de assumir um valor fixo).
  const agsOrdenados = [...item.agendamentos].sort((a, b) => a.dataProgramada - b.dataProgramada);
  let intervaloMedioDias = 1;
  if (agsOrdenados.length >= 2) {
    const totalDias = diferencaEmDias(agsOrdenados[0].dataProgramada, agsOrdenados[agsOrdenados.length - 1].dataProgramada);
    intervaloMedioDias = totalDias / (agsOrdenados.length - 1) || 1;
  }
  const dataEsgotamento = somarDias(HOJE, dosesRestantesEstoque * intervaloMedioDias);

  return {
    unidadeRestante: arredondar1(unidadeRestante),
    dosesRestantesEstoque,
    dataEsgotamento,
    baixoEstoque: dosesRestantesEstoque <= 2,
  };
}

/**
 * Reconstituição de peptídeos. Seringas de insulina usam a escala 1mL=100 UI,
 * logo 1 UI = 1/100 mL. concentração(mcg/mL) = pó total(mcg)/diluente(mL);
 * mcg por UI = concentração/100; UI a puxar = dose alvo(mcg)/mcg por UI.
 */
function calcularDoseSeringa(vialMg, volumeDiluenteMl, doseMcgAlvo, tamanhoSeringaUi) {
  const totalMcg = (Number(vialMg) || 0) * 1000;
  const volume = Number(volumeDiluenteMl) || 0;
  if (totalMcg <= 0 || volume <= 0) return null;
  const concentracaoMcgMl = totalMcg / volume;
  const mcgPorUi = concentracaoMcgMl / 100;
  const unidadesParaPuxar = mcgPorUi > 0 ? arredondar1((Number(doseMcgAlvo) || 0) / mcgPorUi) : 0;
  const excede = unidadesParaPuxar > tamanhoSeringaUi;
  return {
    concentracaoMcgMl: arredondar2(concentracaoMcgMl),
    mcgPorUi: arredondar2(mcgPorUi),
    unidadesParaPuxar,
    excede,
    mensagem: excede
      ? `Essa dose exigiria ${unidadesParaPuxar} UI, acima da capacidade da seringa de ${tamanhoSeringaUi} UI. Use menos diluente ou uma seringa maior.`
      : `Puxe até a marca de ${unidadesParaPuxar} UI na seringa de ${tamanhoSeringaUi} UI.`,
  };
}

// ============================================================================
// AÇÕES DE ESTADO
// ============================================================================
function darCheckNoHorario(itens, itemId, agendamentoId, sitio = null) {
  return itens.map((item) => (item.id !== itemId ? item : { ...item, agendamentos: item.agendamentos.map((a) => (a.id === agendamentoId ? { ...a, realizada: true, dataReal: a.dataProgramada, sitio } : a)) }));
}
function desfazerCheckin(itens, itemId, agendamentoId) {
  return itens.map((item) => (item.id !== itemId ? item : { ...item, agendamentos: item.agendamentos.map((a) => (a.id === agendamentoId ? { ...a, realizada: false, dataReal: null, sitio: null } : a)) }));
}
function confirmarDoseAtrasada(itens, itemId, agendamentoId, dataRealEscolhida, sitio = null) {
  return itens.map((item) => {
    if (item.id !== itemId) return item;
    const agendamentoAlvo = item.agendamentos.find((a) => a.id === agendamentoId);
    if (!agendamentoAlvo) return item;
    const desvioDias = diferencaEmDias(agendamentoAlvo.dataProgramada, dataRealEscolhida);
    const novosAgendamentos = item.agendamentos.map((a) => {
      if (a.id === agendamentoId) return { ...a, realizada: true, dataReal: dataRealEscolhida, sitio };
      const eFutura = a.dataProgramada > agendamentoAlvo.dataProgramada;
      if (eFutura && !a.realizada && desvioDias !== 0) return { ...a, dataProgramada: somarDias(a.dataProgramada, desvioDias) };
      return a;
    });
    return { ...item, agendamentos: novosAgendamentos };
  });
}

// ============================================================================
// ESTADO INICIAL SIMULADO
// ============================================================================
// ============================================================================
// PERSISTÊNCIA — serialização de datas para o storage dos artifacts
// (JSON não guarda objetos Date nativamente, então convertemos para ISO string
// ao salvar e reconstruímos os objetos Date ao carregar)
// ============================================================================
const CHAVE_STORAGE = "aerolog-estado-v1";
// Chave separada: marca que o guia inicial já foi visto. Fica fora de CHAVE_STORAGE
// para que "Reiniciar dados" não force o guia de novo sem necessidade.
const CHAVE_ONBOARDING = "pepplot-guia-visto-v1";

/**
 * Lê o histórico de peso do arquivo salvo. Versões antigas guardavam um único
 * número em `pesoCorporal` — nesse caso, converte para um registro único.
 */
function carregarPesos(dados) {
  if (Array.isArray(dados.pesos)) {
    return dados.pesos.map((p) => ({ ...p, data: new Date(p.data) })).sort((a, b) => a.data - b.data);
  }
  if (dados.pesoCorporal) {
    return [{ id: "peso-migrado", data: truncarParaDia(new Date()), valorKg: dados.pesoCorporal }];
  }
  return [];
}

function serializarCiclos(ciclos) {
  return ciclos.map((c) => ({
    ...c,
    exames: (c.exames || []).map((e) => ({ ...e, data: e.data.toISOString() })),
    sintomas: (c.sintomas || []).map((s) => ({ ...s, data: s.data.toISOString() })),
    itens: c.itens.map((it) => ({
      ...it,
      dataInicio: it.dataInicio.toISOString(),
      agendamentos: it.agendamentos.map((a) => ({
        ...a,
        dataProgramada: a.dataProgramada.toISOString(),
        dataReal: a.dataReal ? a.dataReal.toISOString() : null,
      })),
    })),
  }));
}

function desserializarCiclos(bruto) {
  return bruto.map((c) => ({
    ...c,
    // `exames` e `arquivado` podem não existir em backups antigos — default seguro
    exames: (c.exames || []).map((e) => ({ ...e, data: new Date(e.data) })),
    sintomas: (c.sintomas || []).map((s) => ({ ...s, data: new Date(s.data) })),
    arquivado: c.arquivado ?? false,
    itens: c.itens.map((it) => ({
      ...it,
      dataInicio: new Date(it.dataInicio),
      agendamentos: it.agendamentos.map((a) => ({
        ...a,
        dataProgramada: new Date(a.dataProgramada),
        dataReal: a.dataReal ? new Date(a.dataReal) : null,
      })),
    })),
  }));
}

          Salvar
        </button>

  );
}

/** Linha do tempo dos sintomas, alinhada ao mesmo eixo de tempo do gráfico de concentração. */
function CardSintomas({ sintomas, hoje, onRegistrar, onExcluir }) {
  const ordenados = useMemo(() => [...sintomas].sort((a, b) => b.data - a.data), [sintomas]);
  // agrupa por sintoma para o gráfico de intensidade ao longo do tempo
  const seriePorNome = useMemo(() => {
    const nomes = [...new Set(sintomas.map((s) => s.nome))];
    const porData = {};
    sintomas.forEach((s) => {
      const chave = paraInputDate(s.data);
      if (!porData[chave]) porData[chave] = { label: formatarDataCurta(s.data), data: s.data };
      porData[chave][s.nome] = s.intensidade;
    });
    return { nomes, dados: Object.values(porData).sort((a, b) => a.data - b.data) };
  }, [sintomas]);

  return (
    <div className="rounded-3xl p-5 mb-4" style={{ backgroundColor: COR.card, border: `1px solid ${COR.borda}` }}>
      <div className="flex items-center justify-between">
        <span className="text-xs font-medium" style={{ color: COR.textoSecundario }}>Sintomas e efeitos colaterais</span>
        <button onClick={onRegistrar} className="text-[11px] font-medium px-3 py-1.5 rounded-lg" style={{ backgroundColor: COR.atrasoClaro, color: COR.atraso }}>
          Registrar
        </button>
      </div>

      {ordenados.length === 0 ? (
        <p className="text-xs mt-2" style={{ color: COR.textoSecundario }}>
          Nenhum sintoma registrado. Anotar intensidade ao longo do ciclo ajuda a relacionar efeitos com os níveis estimados.
        </p>
      ) : (
        <>
          {seriePorNome.dados.length > 1 && (
            <div className="h-32 mt-3 -ml-2">
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={seriePorNome.dados} margin={{ top: 4, right: 8, bottom: 0, left: 0 }}>
                  <CartesianGrid vertical={false} stroke={COR.borda} />
                  <XAxis dataKey="label" tick={{ fontSize: 9, fill: COR.textoSecundario }} axisLine={false} tickLine={false} interval="preserveStartEnd" />
                  <YAxis domain={[0, 10]} ticks={[0, 5, 10]} tick={{ fontSize: 9, fill: COR.textoSecundario }} axisLine={false} tickLine={false} width={26} />
                  <Tooltip contentStyle={{ borderRadius: 12, border: `1px solid ${COR.borda}`, fontSize: 12, backgroundColor: COR.card, color: COR.textoPrincipal }} />
                  {seriePorNome.nomes.map((n, i) => (
                    <Line key={n} type="monotone" dataKey={n} stroke={PALETA_SELECIONAVEL[i % PALETA_SELECIONAVEL.length].cor} strokeWidth={2} dot={{ r: 3 }} isAnimationActive={false} connectNulls />
                  ))}
                </LineChart>
              </ResponsiveContainer>
            </div>
          )}

          <div className="flex flex-col gap-1.5 mt-3">
            {ordenados.slice(0, 6).map((s) => {
              const cor = s.intensidade >= 7 ? COR.perdido : s.intensidade >= 4 ? COR.atraso : COR.acentoReal;
              return (
                <div key={s.id} className="flex items-center gap-2.5 px-3 py-2 rounded-xl" style={{ backgroundColor: "#1E2126" }}>
                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-medium truncate" style={{ color: COR.textoPrincipal }}>{s.nome}</p>
                    <p className="text-[10px]" style={{ color: COR.textoSecundario }}>
                      {formatarDataCurta(s.data)}{s.observacao ? ` · ${s.observacao}` : ""}
                    </p>
                  </div>
                  <span className="text-xs font-bold tabular-nums shrink-0" style={{ color: cor }}>{s.intensidade}/10</span>
                  <button onClick={() => onExcluir(s.id)} className="shrink-0" aria-label="Excluir registro">
                    <Trash2 size={12} style={{ color: COR.textoSecundario }} />
                  </button>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

/** Peso atual, variação e mini-gráfico da evolução ao longo do tempo. */
function CardPeso({ pesos, alturaCm, onRegistrar }) {
  const atual = pesos.length > 0 ? pesos[pesos.length - 1] : null;
  const primeiro = pesos.length > 0 ? pesos[0] : null;
  const variacao = atual && primeiro ? arredondar1(atual.valorKg - primeiro.valorKg) : 0;
  const imc = atual && alturaCm > 0 ? arredondar1(atual.valorKg / Math.pow(alturaCm / 100, 2)) : null;
  const dadosGrafico = pesos.map((p) => ({ label: formatarDataCurta(p.data), kg: p.valorKg }));

  return (
    <div className="rounded-3xl p-5 mb-4" style={{ backgroundColor: COR.card, border: `1px solid ${COR.borda}` }}>
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <Scale size={15} style={{ color: COR.acentoReal }} />
          <span className="text-xs font-medium" style={{ color: COR.textoSecundario }}>Massa corporal</span>
        </div>
        <button onClick={onRegistrar} className="text-[11px] font-medium px-3 py-1.5 rounded-lg" style={{ backgroundColor: COR.acentoRealClaro, color: COR.acentoReal }}>
          Registrar peso
        </button>
      </div>

      {atual ? (
        <>
          <div className="flex items-baseline gap-2 mt-2">
            <span className="text-3xl font-bold tabular-nums" style={{ color: COR.textoPrincipal }}>{formatarNumeroBR(atual.valorKg)}</span>
            <span className="text-sm" style={{ color: COR.textoSecundario }}>kg</span>
            {pesos.length > 1 && (
              <span className="text-[11px] font-medium px-2 py-0.5 rounded-full" style={{ color: variacao >= 0 ? COR.acentoReal : COR.acentoPeptideo, backgroundColor: variacao >= 0 ? COR.acentoRealClaro : COR.acentoPeptideoClaro }}>
                {variacao > 0 ? "+" : ""}{formatarNumeroBR(variacao)} kg desde o início
              </span>
            )}
          </div>
          <p className="text-[11px] mt-0.5" style={{ color: COR.textoSecundario }}>
            Atualizado em {formatarDataCurta(atual.data)}
            {imc && <> · IMC {formatarNumeroBR(imc)}</>}
          </p>

          {pesos.length > 1 && (
            <div className="h-24 mt-3 -ml-2">
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={dadosGrafico} margin={{ top: 4, right: 8, bottom: 0, left: 0 }}>
                  <CartesianGrid vertical={false} stroke={COR.borda} />
                  <XAxis dataKey="label" tick={{ fontSize: 9, fill: COR.textoSecundario }} axisLine={false} tickLine={false} interval="preserveStartEnd" />
                  <YAxis tick={{ fontSize: 9, fill: COR.textoSecundario }} axisLine={false} tickLine={false} width={34} domain={["dataMin - 2", "dataMax + 2"]} />
                  <Tooltip contentStyle={{ borderRadius: 12, border: `1px solid ${COR.borda}`, fontSize: 12, backgroundColor: COR.card, color: COR.textoPrincipal }} formatter={(v) => [`${v} kg`, "Peso"]} />
                  <Line type="monotone" dataKey="kg" stroke={COR.acentoReal} strokeWidth={2} dot={{ r: 3, fill: COR.acentoReal }} isAnimationActive={false} />
                </LineChart>
              </ResponsiveContainer>
            </div>
          )}
          <p className="text-[10px] mt-2" style={{ color: COR.textoSecundario }}>
            O peso de cada data é usado no cálculo da curva daquele período.
          </p>
        </>
      ) : (
        <p className="text-xs mt-2" style={{ color: COR.textoSecundario }}>
          Nenhum peso registrado — a curva está usando 70 kg como referência. Registre seu peso para uma estimativa mais fiel.
        </p>
      )}
    </div>
  );
}

/** Escolha do sítio de aplicação no momento do check-in, com sugestão de rodízio. */
function ModalSitio({ agendamento, itens, hoje, onConfirmar, onFechar }) {
  const sugerido = useMemo(() => sugerirProximoSitio(itens), [itens]);
  const [sitio, setSitio] = useState(sugerido.valor);
  const diasUltimo = diasDesdeUltimoUso(itens, sitio, hoje);
  const repetindoCedo = diasUltimo !== null && diasUltimo < 7;

  return (
    <BottomSheet corDestaque={COR.acentoReal}>
      <div className="flex items-center gap-2 mb-1">
        <Syringe size={16} style={{ color: COR.acentoReal }} />
        <p className="text-xs font-semibold" style={{ color: COR.acentoReal }}>Local da aplicação</p>
      </div>
      <p className="text-[11px] mb-4" style={{ color: COR.textoSecundario }}>
        {agendamento.compostoNome} · {formatarNumeroBR(agendamento.doseExibicao)}{agendamento.unidadeExibicao}
      </p>

      <div className="flex flex-col gap-1.5">
        {SITIOS_RODIZIO.map((s) => {
          const dias = diasDesdeUltimoUso(itens, s.valor, hoje);
          const ativo = sitio === s.valor;
          return (
            <button key={s.valor} onClick={() => setSitio(s.valor)} className="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-left" style={{ backgroundColor: ativo ? COR.acentoRealClaro : "#22252B", border: `1px solid ${ativo ? COR.acentoReal : "transparent"}` }}>
              <span className="text-sm" style={{ color: ativo ? COR.acentoReal : COR.textoPrincipal }}>
                {s.label}
                {s.valor === sugerido.valor && <span className="ml-2 text-[10px] px-1.5 py-0.5 rounded" style={{ backgroundColor: COR.acentoRealClaro, color: COR.acentoReal }}>sugerido</span>}
              </span>
              <span className="text-[11px]" style={{ color: COR.textoSecundario }}>
                {dias === null ? "nunca usado" : dias === 0 ? "usado hoje" : `há ${dias}d`}
              </span>
            </button>
          );
        })}
      </div>

      {repetindoCedo && (
        <p className="text-[11px] font-medium mt-3" style={{ color: COR.atraso }}>
          Este local foi usado há {diasUltimo} dia(s). Repetir o mesmo ponto em intervalo curto favorece fibrose e absorção irregular.
        </p>
      )}

      <div className="flex gap-2 mt-5">
        <button onClick={onFechar} className="flex-1 text-sm font-medium py-3 rounded-xl" style={{ backgroundColor: "#22252B", color: COR.textoPrincipal }}>Cancelar</button>
        <button onClick={() => onConfirmar(sitio)} className="flex-1 text-sm font-medium py-3 rounded-xl" style={{ backgroundColor: COR.acentoReal, color: COR.bg }}>Confirmar aplicação</button>
      </div>
    </BottomSheet>
  );
}

/** Barra visual da seringa — preenchimento proporcional às UI a puxar. */
function SeringaVisual({ unidadesParaPuxar, tamanhoSeringaUi, excede }) {
  const marcas = [];
  for (let m = 10; m <= tamanhoSeringaUi; m += 10) marcas.push(m);
  const percentualPreenchido = Math.min((unidadesParaPuxar / tamanhoSeringaUi) * 100, 100);
  const cor = excede ? COR.perdido : COR.acentoPeptideo;
  return (
    <div>
      <div className="relative h-8 rounded-full overflow-hidden" style={{ backgroundColor: "#22252B", border: `1px solid ${COR.borda}` }}>
        <div className="absolute inset-y-0 left-0 rounded-full transition-all" style={{ width: `${percentualPreenchido}%`, backgroundColor: cor, opacity: 0.85 }} />
      </div>
      <div className="flex justify-between mt-1 px-0.5">
        {marcas.map((m) => (
          <span key={m} className="text-[9px]" style={{ color: COR.textoSecundario }}>{m}</span>
        ))}
      </div>
    </div>
  );
}

const LOCAIS_APLICACAO_IM = [
  { valor: "gluteo", label: "Glúteo (dorso/ventroglúteo)", agulha: "25G ou 23G x 1½\" (38mm)", volumeMax: 3 },
  { valor: "vasto_lateral", label: "Vasto lateral (coxa)", agulha: "25G x 1\" a 1½\" (25-38mm)", volumeMax: 2 },
  { valor: "deltoide", label: "Deltoide (ombro)", agulha: "25G ou 27G x 1\" (25mm)", volumeMax: 1 },
];

/**
 * Sítios de aplicação com lateralidade, para o rodízio. Aplicar repetidamente no
 * mesmo ponto favorece fibrose e lipo-hipertrofia, o que altera a absorção — e
 * uma absorção errática invalida a própria curva estimada pelo app.
 */
const SITIOS_RODIZIO = [
  { valor: "gluteo_d", label: "Glúteo direito", base: "gluteo" },
  { valor: "gluteo_e", label: "Glúteo esquerdo", base: "gluteo" },
  { valor: "vasto_d", label: "Vasto lateral direito", base: "vasto_lateral" },
  { valor: "vasto_e", label: "Vasto lateral esquerdo", base: "vasto_lateral" },
  { valor: "deltoide_d", label: "Deltoide direito", base: "deltoide" },
  { valor: "deltoide_e", label: "Deltoide esquerdo", base: "deltoide" },
];
const rotuloSitio = (valor) => SITIOS_RODIZIO.find((s) => s.valor === valor)?.label ?? null;

/**
 * Sugere o próximo sítio do rodízio: o que está há mais tempo sem uso.
 * Considera todas as aplicações já realizadas do ciclo, não só de um composto.
 */
function sugerirProximoSitio(itens) {
  const usos = itens
    .flatMap((it) => it.agendamentos)
    .filter((a) => a.realizada && a.sitio)
    .sort((a, b) => (b.dataReal ?? b.dataProgramada) - (a.dataReal ?? a.dataProgramada));

  if (usos.length === 0) return SITIOS_RODIZIO[0];
  const usadosRecentes = [];
  for (const u of usos) {
    if (!usadosRecentes.includes(u.sitio)) usadosRecentes.push(u.sitio);
  }
  // primeiro sítio que ainda não apareceu na lista de usos recentes
  const inedito = SITIOS_RODIZIO.find((s) => !usadosRecentes.includes(s.valor));
  if (inedito) return inedito;
  // todos já usados: pega o que foi usado há mais tempo
  const maisAntigo = usadosRecentes[usadosRecentes.length - 1];
  return SITIOS_RODIZIO.find((s) => s.valor === maisAntigo) ?? SITIOS_RODIZIO[0];
}

/** Há quantos dias cada sítio foi usado pela última vez (para alertar repetição). */
function diasDesdeUltimoUso(itens, sitio, hoje) {
  const usos = itens
    .flatMap((it) => it.agendamentos)
    .filter((a) => a.realizada && a.sitio === sitio)
    .map((a) => a.dataReal ?? a.dataProgramada)
    .sort((a, b) => b - a);
  if (usos.length === 0) return null;
  return Math.round(diferencaEmDias(usos[0], hoje));
}

function recomendarSeringaVolume(volumeMl) {
  if (volumeMl <= 1) return "Seringa de 1ml (insulina ou tuberculina)";
  if (volumeMl <= 3) return "Seringa de 3ml";
  return "Seringa de 5ml — considere dividir a dose em duas aplicações";
}

function CalculadoraAspiracaoHormonios() {
  const [concentracaoMgMl, setConcentracaoMgMl] = useState(250);
  const [doseAlvoMg, setDoseAlvoMg] = useState(250);
  const [localValor, setLocalValor] = useState(LOCAIS_APLICACAO_IM[0].valor);
  const local = LOCAIS_APLICACAO_IM.find((l) => l.valor === localValor);

  const volumeMl = useMemo(() => {
    const c = Number(concentracaoMgMl) || 0;
    if (c <= 0) return null;
    return arredondar2((Number(doseAlvoMg) || 0) / c);
  }, [concentracaoMgMl, doseAlvoMg]);

  const excedeVolumeLocal = volumeMl != null && local && volumeMl > local.volumeMax;

  return (
    <div className="flex flex-col gap-4 pt-3">
      <div className="grid grid-cols-2 gap-3">
        <CampoNumero label="Concentração (mg/ml):" valor={concentracaoMgMl} onChange={setConcentracaoMgMl} />
        <CampoNumero label="Dose alvo (mg):" valor={doseAlvoMg} onChange={setDoseAlvoMg} />
      </div>

      <CampoSelect label="Local de aplicação (IM):" valor={localValor} onChange={setLocalValor} opcoes={LOCAIS_APLICACAO_IM.map((l) => ({ valor: l.valor, label: l.label }))} />

      {volumeMl != null && (
        <div className="rounded-2xl p-4" style={{ backgroundColor: COR.acentoRealClaro }}>
          <p className="text-xs mb-1" style={{ color: COR.textoSecundario }}>Volume a aspirar:</p>
          <p className="text-2xl font-bold" style={{ color: COR.acentoReal }}>{formatarNumeroBR(volumeMl)} ml</p>

          <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${COR.borda}` }}>
            <p className="text-xs" style={{ color: COR.textoSecundario }}>
              Agulha recomendada para {local.label.toLowerCase()}: <strong style={{ color: COR.textoPrincipal }}>{local.agulha}</strong>
            </p>
            <p className="text-xs mt-1" style={{ color: COR.textoSecundario }}>
              Seringa recomendada: <strong style={{ color: COR.textoPrincipal }}>{recomendarSeringaVolume(volumeMl)}</strong>
            </p>
          </div>

          {excedeVolumeLocal && (
            <p className="text-xs font-medium mt-3" style={{ color: COR.atraso }}>
              Esse volume ({formatarNumeroBR(volumeMl)}ml) está acima do costumeiramente recomendado para {local.label.toLowerCase()} (até {local.volumeMax}ml). Considere outro local ou dividir a aplicação.
            </p>
          )}
        </div>
      )}

      <p className="text-[11px]" style={{ color: COR.textoSecundario }}>
        Recomendações de agulha/seringa são referências gerais de literatura para aplicação intramuscular — ajuste conforme orientação profissional e características individuais (composição corporal, viscosidade do óleo).
      </p>
    </div>
  );
}

  const nivelAtual = pontosGrafico[indiceHoje]?.real ?? 0;

// ============================================================================
// CARD DE NÍVEL — HORMÔNIOS (multi-grupo, com Sobrepor/Comparar)
// ============================================================================
function CardNivelHormonios({ itens, periodo, setPeriodo, hoje, pesoCorporal = 70, exames = [], onAdicionarExame }) {
  const [modo, setModo] = useState("sobrepor");
  const grupos = useMemo(() => agruparItensHormonio(itens, modo), [itens, modo]);
  const pontosBase = useMemo(() => gerarDadosGraficoMultiGrupo(grupos, hoje, pesoCorporal), [grupos, hoje, pesoCorporal]);
  // Sobrepõe os exames de sangue reais nos pontos do gráfico: cada exame vira um
  // ponto isolado (`exame`) no mesmo eixo da curva estimada, permitindo comparar
  // visualmente a previsão do modelo com a dosagem laboratorial de fato.
  const pontos = useMemo(() => {
    if (exames.length === 0) return pontosBase;
    return pontosBase.map((p) => {
      const doDia = exames.find((e) => mesmoDia(e.data, p.dia));
      return doDia ? { ...p, exame: doDia.valorNgDl, exameObs: doDia.observacao || "" } : p;
    });
  }, [pontosBase, exames]);
  const indiceHoje = useMemo(() => pontos.findIndex((p) => mesmoDia(p.dia, hoje)), [pontos]);

  const dadosVisiveis = useMemo(() => {
    if (pontos.length === 0) return [];
    if (periodo === null) return pontos;
    const janelaDias = periodo * 7;
    const inicio = Math.max(0, indiceHoje - janelaDias);
    const fim = Math.min(pontos.length - 1, indiceHoje + janelaDias);
    return pontos.slice(inicio, fim + 1);
  }, [pontos, periodo, indiceHoje]);

  // Compara cada exame com o valor que o modelo previa para aquele mesmo dia —
  // é isso que permite validar (ou ajustar) a calibração com dados reais.
  const desviosModelo = useMemo(() => {
    return exames.map((e) => {
      const ponto = pontosBase.find((p) => mesmoDia(p.dia, e.data));
      if (!ponto) return null;
      const previsto = grupos.reduce((s, g) => s + (ponto[`${g.chave}_real`] ?? ponto[`${g.chave}_prevista`] ?? 0), 0);
      if (previsto <= 0) return null;
      return { data: e.data, real: e.valorNgDl, previsto: arredondar1(previsto), desvioPct: Math.round(((e.valorNgDl - previsto) / previsto) * 100) };
    }).filter(Boolean).sort((a, b) => b.data - a.data);
  }, [exames, pontosBase, grupos]);

  const nivelTotalAtual = arredondar1(grupos.reduce((soma, g) => soma + (pontos[indiceHoje]?.[`${g.chave}_real`] ?? 0), 0));

  return (
    <div className="rounded-3xl p-5" style={{ backgroundColor: COR.card, border: `1px solid ${COR.borda}` }}>
      <div className="flex items-center justify-between">
        <p className="text-xs font-medium" style={{ color: COR.textoSecundario }}>Nível plasmático (hormônios):</p>
        <div className="flex gap-1 p-1 rounded-lg" style={{ backgroundColor: "#22252B" }}>
          {[{ valor: "sobrepor", label: "Sobrepor" }, { valor: "comparar", label: "Comparar" }].map((op) => (
            <button key={op.valor} onClick={() => setModo(op.valor)} className="text-[11px] font-medium px-2.5 py-1 rounded-md" style={{ backgroundColor: modo === op.valor ? COR.card : "transparent", color: modo === op.valor ? COR.textoPrincipal : COR.textoSecundario, boxShadow: modo === op.valor ? "0 1px 2px rgba(0,0,0,0.06)" : "none" }}>
              {op.label}
            </button>
          ))}
        </div>
      </div>

      <div className="flex items-baseline gap-1.5 mt-1.5">
        <span className="text-4xl font-bold tabular-nums" style={{ color: COR.textoPrincipal }}>{formatarNumeroBR(nivelTotalAtual)}</span>
        <span className="text-base font-medium" style={{ color: COR.textoSecundario }}>ng/dL total</span>
      </div>

      <div className="flex flex-wrap items-center gap-x-3 gap-y-1.5 mt-3">
        {grupos.map((g) => (
          <div key={g.chave} className="flex items-center gap-1.5">
            <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: g.cor }} />
            <span className="text-[11px]" style={{ color: COR.textoSecundario }}>{g.nome}: <strong style={{ color: COR.textoPrincipal }}>{formatarNumeroBR(pontos[indiceHoje]?.[`${g.chave}_real`] ?? 0)} ng/dL</strong></span>
          </div>
        ))}
        <div className="flex items-center gap-1.5">
          <span className="w-2.5 h-0.5 rounded-full" style={{ backgroundImage: `repeating-linear-gradient(90deg, ${COR.prevista} 0 3px, transparent 3px 6px)` }} />
          <span className="text-[11px]" style={{ color: COR.textoSecundario }}>Prevista</span>
        </div>
        {exames.length > 0 && (
          <div className="flex items-center gap-1.5">
            <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: COR.exame }} />
            <span className="text-[11px]" style={{ color: COR.textoSecundario }}>Exame de sangue</span>
          </div>
        )}
      </div>

      {onAdicionarExame && (
        <button onClick={onAdicionarExame} className="flex items-center gap-1.5 mt-3 text-[11px] font-medium px-3 py-1.5 rounded-lg" style={{ backgroundColor: COR.exameClaro, color: COR.exame }}>
          <Droplet size={12} /> Registrar exame de sangue
        </button>
      )}

      {desviosModelo.length > 0 && (
        <div className="mt-3 rounded-xl p-3" style={{ backgroundColor: "#1E2126" }}>
          <p className="text-[11px] font-medium mb-2" style={{ color: COR.textoSecundario }}>Exame vs. estimativa do modelo:</p>
          {desviosModelo.slice(0, 3).map((d, i) => (
            <div key={i} className="flex items-center justify-between text-[11px] py-0.5">
              <span style={{ color: COR.textoSecundario }}>{formatarDataCurta(d.data)}</span>
              <span style={{ color: COR.textoPrincipal }}>
                {formatarNumeroBR(d.real)} <span style={{ color: COR.textoSecundario }}>vs. {formatarNumeroBR(d.previsto)} ng/dL</span>
              </span>
              <span className="font-medium" style={{ color: Math.abs(d.desvioPct) <= 20 ? COR.acentoReal : COR.atraso }}>
                {d.desvioPct > 0 ? "+" : ""}{d.desvioPct}%
              </span>
            </div>
          ))}
        </div>
      )}

      <div className="flex gap-1 mt-4 p-1 rounded-xl w-fit" style={{ backgroundColor: "#22252B" }}>
        {[{ label: "4S", valor: 4 }, { label: "8S", valor: 8 }, { label: "12S", valor: 12 }, { label: "Tudo", valor: null }].map((opt) => (
          <button key={opt.label} onClick={() => setPeriodo(opt.valor)} className="text-xs font-medium px-3 py-1.5 rounded-lg transition-colors" style={{ backgroundColor: periodo === opt.valor ? COR.card : "transparent", color: periodo === opt.valor ? COR.textoPrincipal : COR.textoSecundario, boxShadow: periodo === opt.valor ? "0 1px 2px rgba(0,0,0,0.06)" : "none" }}>
            {opt.label}
          </button>
        ))}
      </div>

      <div className="h-52 lg:h-72 mt-3 -ml-2">
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={dadosVisiveis} margin={{ top: 8, right: 8, bottom: 0, left: 0 }}>
            <CartesianGrid vertical={false} stroke={COR.borda} />
            <XAxis dataKey="label" tick={{ fontSize: 10, fill: COR.textoSecundario }} axisLine={false} tickLine={false} interval="preserveStartEnd" />
            <YAxis tick={{ fontSize: 10, fill: COR.textoSecundario }} axisLine={false} tickLine={false} width={38} domain={[0, "dataMax + 100"]} label={{ value: "ng/dL", angle: -90, position: "insideLeft", fontSize: 9, fill: COR.textoSecundario }} />
            <Tooltip contentStyle={{ borderRadius: 12, border: `1px solid ${COR.borda}`, fontSize: 12, backgroundColor: COR.card, color: COR.textoPrincipal }} formatter={(v) => [`${v} ng/dL`, "Nível estimado"]} />
            <ReferenceLine x={pontos[indiceHoje]?.label} stroke={COR.textoSecundario} strokeDasharray="2 3" />
            {grupos.map((g) => (
              <Line key={`${g.chave}-prevista`} type="monotone" dataKey={`${g.chave}_prevista`} stroke={COR.prevista} strokeWidth={1.5} strokeDasharray="4 4" dot={false} isAnimationActive={false} />
            ))}
            {grupos.map((g) => (
              <Line key={`${g.chave}-real`} type="monotone" dataKey={`${g.chave}_real`} stroke={g.cor} strokeWidth={2.5} dot={false} isAnimationActive={false} connectNulls={false} />
            ))}
            {/* Exames de sangue: pontos isolados, sem linha conectando */}
            <Line type="monotone" dataKey="exame" stroke="none" isAnimationActive={false} connectNulls={false}
              dot={{ r: 5, fill: COR.exame, stroke: COR.bg, strokeWidth: 2 }} />
            <Brush dataKey="label" height={18} stroke={COR.acentoReal} fill={COR.card} travellerWidth={8} tickFormatter={() => ""} />
          </LineChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

// ============================================================================
