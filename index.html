function TelaMeuCiclo() {
  const [carregado, setCarregado] = useState(false);
  const [ciclos, setCiclos] = useState([]);
  const [cicloAtivoId, setCicloAtivoId] = useState(null);
  const [periodo, setPeriodo] = useState(8);
  const [pesos, setPesos] = useState([]); // [{id, data, valorKg}] ordenado por data
  const [alturaCm, setAlturaCm] = useState(0);
  const [fabAberto, setFabAberto] = useState(false);
  const [editandoNome, setEditandoNome] = useState(false);
  const [nomeTemp, setNomeTemp] = useState("");
  const [tela, setTela] = useState("ciclo");
  const [abaAtiva, setAbaAtiva] = useState("ciclo"); // 'calculadora' | 'ciclo' | 'grafico'
  const [modoCalculadora, setModoCalculadora] = useState("peptideos"); // 'peptideos' | 'hormonios'
  const [modalAtraso, setModalAtraso] = useState(null);
  const [modalDesfazer, setModalDesfazer] = useState(null);
  const [itemEditando, setItemEditando] = useState(null);
  const [modalExameAberto, setModalExameAberto] = useState(false);
  const [modalSitio, setModalSitio] = useState(null);
  const [modalPesoAberto, setModalPesoAberto] = useState(false);
  const [modalSintomaAberto, setModalSintomaAberto] = useState(false);
  // Em telas grandes, Cronograma e Gráfico aparecem lado a lado (sem trocar de aba)
  const [mostrarGuia, setMostrarGuia] = useState(false);
  const [agora, setAgora] = useState(() => new Date());
  const [telaLarga, setTelaLarga] = useState(() => (typeof window !== "undefined" ? window.innerWidth >= 1024 : false));
  const [toast, setToast] = useState(null);
  const [confirmandoReset, setConfirmandoReset] = useState(false);
  const [mostrarArquivados, setMostrarArquivados] = useState(false);
  const [erroStorage, setErroStorage] = useState(false);
  const inputNomeRef = useRef(null);
  const inputImportarRef = useRef(null);

  // ---- Carrega os dados salvos ao abrir o app (uma única vez) ----
  useEffect(() => {
    try {
      const bruto = localStorage.getItem(CHAVE_STORAGE);
      if (bruto) {
        const dados = JSON.parse(bruto);
        const ciclosCarregados = desserializarCiclos(dados.ciclos || []);
        setCiclos(ciclosCarregados);
        setCicloAtivoId(dados.cicloAtivoId ?? ciclosCarregados[0]?.id ?? null);
      } else {
        const inicial = gerarCicloInicial();
        setCiclos([inicial]);
        setCicloAtivoId(inicial.id);
      }
    } catch {
      // Primeira vez usando o app (ou dado salvo corrompido) — começa com o ciclo de exemplo
      const inicial = gerarCicloInicial();
      setCiclos([inicial]);
      setCicloAtivoId(inicial.id);
    } finally {
      setCarregado(true);
    }
    try {
      if (!localStorage.getItem(CHAVE_ONBOARDING)) setMostrarGuia(true);
    } catch { /* storage indisponível — segue sem o guia */ }
  }, []);

  // Relógio para o countdown da próxima dose (1s)
  useEffect(() => {
    const t = setInterval(() => setAgora(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  // ---- Salva automaticamente sempre que os ciclos/ciclo ativo/peso mudam ----
  useEffect(() => {
    if (!carregado) return; // evita sobrescrever o storage antes do carregamento inicial terminar
    const salvar = () => {
      try {
        localStorage.setItem(CHAVE_STORAGE, JSON.stringify({ ciclos: serializarCiclos(ciclos), cicloAtivoId, alturaCm, pesos: pesos.map((p) => ({ ...p, data: p.data.toISOString() })) }));
        setErroStorage(false);
      } catch {
        setErroStorage(true);
      }
    };
    const timeout = setTimeout(salvar, 350); // pequeno atraso para agrupar mudanças rápidas em seguida
    return () => clearTimeout(timeout);
  }, [ciclos, cicloAtivoId, pesos, alturaCm, carregado]);

  const handleReiniciarDados = () => {
    try { localStorage.removeItem(CHAVE_STORAGE); } catch { /* nada salvo ainda, tudo bem */ }
    const inicial = gerarCicloInicial();
    setCiclos([inicial]);
    setCicloAtivoId(inicial.id);
    setPesos([]);
    setAlturaCm(0);
    setConfirmandoReset(false);
    setToast("Dados reiniciados.");
  };

  const concluirGuia = () => {
    try { localStorage.setItem(CHAVE_ONBOARDING, "1"); } catch { /* sem storage, o guia reaparece — aceitável */ }
    setMostrarGuia(false);
  };

  const handleExportarBackup = () => {
    const payload = JSON.stringify({ ciclos: serializarCiclos(ciclos), cicloAtivoId, alturaCm, pesos: pesos.map((p) => ({ ...p, data: p.data.toISOString() })), exportadoEm: new Date().toISOString() }, null, 2);
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `pepplot-backup-${paraInputDate(HOJE)}.json`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    setToast("Backup exportado.");
  };

  const handleImportarBackup = (arquivo) => {
    const leitor = new FileReader();
    leitor.onload = (e) => {
      try {
        const dados = JSON.parse(e.target.result);
        const ciclosImportados = desserializarCiclos(dados.ciclos || []);
        if (ciclosImportados.length === 0) throw new Error("Arquivo vazio");
        setCiclos(ciclosImportados);
        setCicloAtivoId(dados.cicloAtivoId ?? ciclosImportados[0].id);
        if (dados.alturaCm) setAlturaCm(dados.alturaCm);
        setPesos(carregarPesos(dados));
        setToast("Backup importado com sucesso.");
      } catch {
        setToast("Não foi possível importar esse arquivo.");
      }
    };
    leitor.readAsText(arquivo);
  };

  const cicloAtivo = ciclos.find((c) => c.id === cicloAtivoId) ?? null;

  useEffect(() => {
    const aoRedimensionar = () => setTelaLarga(window.innerWidth >= 1024);
    window.addEventListener("resize", aoRedimensionar);
    return () => window.removeEventListener("resize", aoRedimensionar);
  }, []);

  useEffect(() => { if (editandoNome && inputNomeRef.current) inputNomeRef.current.select(); }, [editandoNome]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2400); return () => clearTimeout(t); }, [toast]);

  const atualizarItensDoCicloAtivo = (novaFn) => setCiclos((atual) => atual.map((c) => (c.id === cicloAtivoId ? { ...c, itens: novaFn(c.itens) } : c)));

  const criarCiclo = () => {
    const novoId = `ciclo-${Date.now()}`;
    setCiclos((atual) => [...atual, { id: novoId, nome: "Novo ciclo", itens: [], arquivado: false }]);
    setCicloAtivoId(novoId);
    setNomeTemp("Novo ciclo");
    setEditandoNome(true);
  };

  const handleEncerrarCiclo = () => {
    setCiclos((atual) => atual.map((c) => (c.id === cicloAtivoId ? { ...c, arquivado: true } : c)));
    const proximoAtivo = ciclos.find((c) => c.id !== cicloAtivoId && !c.arquivado);
    setCicloAtivoId(proximoAtivo?.id ?? null);
    setToast("Ciclo encerrado e arquivado.");
  };

  const handleReativarCiclo = (id) => {
    setCiclos((atual) => atual.map((c) => (c.id === id ? { ...c, arquivado: false } : c)));
    setCicloAtivoId(id);
    setToast("Ciclo reativado.");
  };

  const salvarNomeCiclo = () => {
    const nomeFinal = nomeTemp.trim() || "Ciclo sem nome";
    setCiclos((atual) => atual.map((c) => (c.id === cicloAtivoId ? { ...c, nome: nomeFinal } : c)));
    setEditandoNome(false);
  };

  // Marcar dose abre antes o seletor de sítio (rodízio); o check-in é concluído
  // em handleConfirmarSitio, quando o usuário escolhe onde aplicou.
  const handleMarcarNoHorario = (agendamentoId) => {
    const item = cicloAtivo.itens.find((it) => it.agendamentos.some((a) => a.id === agendamentoId));
    if (!item) return;
    const ag = item.agendamentos.find((a) => a.id === agendamentoId);
    // Peptídeos costumam ser subcutâneos; o rodízio IM só se aplica a hormônios
    if (item.categoria !== "hormonio") {
      atualizarItensDoCicloAtivo((itens) => darCheckNoHorario(itens, item.id, agendamentoId));
      return;
    }
    setModalSitio({ agendamento: ag, itemId: item.id, atrasada: false });
  };

  const handleConfirmarSitio = (sitio) => {
    const { agendamento, itemId, atrasada, dataReal } = modalSitio;
    if (atrasada) {
      atualizarItensDoCicloAtivo((itens) => confirmarDoseAtrasada(itens, itemId, agendamento.id, dataReal, sitio));
      const desvio = Math.round(diferencaEmDias(agendamento.dataProgramada, dataReal));
      setToast(desvio === 0 ? "Dose confirmada no dia programado." : `Dose confirmada com ${desvio}d de atraso — próximas doses reajustadas.`);
    } else {
      atualizarItensDoCicloAtivo((itens) => darCheckNoHorario(itens, itemId, agendamento.id, sitio));
      setToast(`Aplicação registrada em ${rotuloSitio(sitio)?.toLowerCase()}.`);
    }
    setModalSitio(null);
  };

  const handleConfirmarAtraso = (dataRealEscolhida) => {
    const item = cicloAtivo.itens.find((it) => it.agendamentos.some((a) => a.id === modalAtraso.id));
    if (item) {
      if (item.categoria === "hormonio") {
        // encadeia no seletor de sítio antes de gravar
        setModalSitio({ agendamento: modalAtraso, itemId: item.id, atrasada: true, dataReal: dataRealEscolhida });
        setModalAtraso(null);
        return;
      }
      atualizarItensDoCicloAtivo((itens) => confirmarDoseAtrasada(itens, item.id, modalAtraso.id, dataRealEscolhida));
      const desvio = Math.round(diferencaEmDias(modalAtraso.dataProgramada, dataRealEscolhida));
      setToast(desvio === 0 ? "Dose confirmada no dia programado." : `Dose confirmada com ${desvio}d de atraso — próximas doses reajustadas.`);
    }
    setModalAtraso(null);
  };

  const handleConfirmarDesfazer = () => {
    const item = cicloAtivo.itens.find((it) => it.agendamentos.some((a) => a.id === modalDesfazer.id));
    if (item) { atualizarItensDoCicloAtivo((itens) => desfazerCheckin(itens, item.id, modalDesfazer.id)); setToast("Check-in desfeito."); }
    setModalDesfazer(null);
  };

  const handleSalvarNovoComposto = (config) => {
    const novoItem = criarItem({ id: `item-${Date.now()}`, ...config });
    atualizarItensDoCicloAtivo((itens) => [...itens, novoItem]);
    setTela("ciclo");
    setToast(`${config.compostoNome} adicionado ao ${cicloAtivo.nome}.`);
  };

  const handleSalvarEdicaoComposto = (campos) => {
    const doseOuFrequenciaMudou =
      campos.dose !== undefined &&
      (campos.dose !== itemEditando.dose || JSON.stringify(campos.frequencia) !== JSON.stringify(itemEditando.frequencia));
    atualizarItensDoCicloAtivo((itens) => {
      let atualizado = atualizarCamposItem(itens, itemEditando.id, campos);
      if (doseOuFrequenciaMudou) {
        atualizado = atualizarProtocoloItem(atualizado, itemEditando.id, { dose: campos.dose, frequencia: campos.frequencia });
      }
      return atualizado;
    });
    setItemEditando(null);
    setToast(doseOuFrequenciaMudou ? "Composto atualizado — próximas doses recalculadas." : "Composto atualizado.");
  };

  const handleSalvarExame = (exame) => {
    setCiclos((atual) => atual.map((c) => (c.id === cicloAtivoId ? { ...c, exames: [...(c.exames || []), exame] } : c)));
    setModalExameAberto(false);
    setToast("Exame registrado.");
  };

  const handleSalvarPeso = (registro, altura) => {
    setPesos((atual) => [...atual.filter((p) => !mesmoDia(p.data, registro.data)), registro].sort((a, b) => a.data - b.data));
    if (altura > 0) setAlturaCm(altura);
    setModalPesoAberto(false);
    setToast("Peso registrado.");
  };

  const handleSalvarSintoma = (registro) => {
    setCiclos((atual) => atual.map((c) => (c.id === cicloAtivoId ? { ...c, sintomas: [...(c.sintomas || []), registro] } : c)));
    setModalSintomaAberto(false);
    setToast("Sintoma registrado.");
  };

  const handleExcluirSintoma = (id) => {
    setCiclos((atual) => atual.map((c) => (c.id === cicloAtivoId ? { ...c, sintomas: (c.sintomas || []).filter((s) => s.id !== id) } : c)));
    setToast("Registro removido.");
  };

  const handleExcluirComposto = () => {
    atualizarItensDoCicloAtivo((itens) => excluirItem(itens, itemEditando.id));
    setToast("Composto excluído do ciclo.");
    setItemEditando(null);
  };

  const itensHormonio = cicloAtivo?.itens.filter((it) => it.categoria === "hormonio") ?? [];
  const itensPeptideo = cicloAtivo?.itens.filter((it) => it.categoria === "peptideo") ?? [];
  const pontosPeptideo = useMemo(() => gerarDadosGrafico(itensPeptideo, HOJE), [itensPeptideo]);
  const aderencia = useMemo(() => (cicloAtivo ? calcularAderenciaCiclo(cicloAtivo.itens, HOJE) : null), [cicloAtivo]);

  const corPorItemId = useMemo(() => {
    const mapa = {};
    (cicloAtivo?.itens ?? []).forEach((it) => { mapa[it.id] = it.categoria === "hormonio" ? it.cor || PALETA_TIPOS_HORMONIO[it.tipoHormonio] || COR.acentoReal : it.cor || CORPADRAO_PEPTIDEO; });
    return mapa;
  }, [cicloAtivo]);

  const agendaVisivel = useMemo(() => {
    if (!cicloAtivo) return [];
    return cicloAtivo.itens
      .flatMap((item) => item.agendamentos.filter((a) => diferencaEmDias(a.dataProgramada, HOJE) <= 21 && diferencaEmDias(HOJE, a.dataProgramada) <= 10).map((a) => ({ ...a, posicao: item.agendamentos.findIndex((x) => x.id === a.id) + 1 })))
      .sort((a, b) => a.dataProgramada - b.dataProgramada);
  }, [cicloAtivo]);

  const pesoAtual = pesos.length > 0 ? pesos[pesos.length - 1].valorKg : 70;
  const proximaAplicacao = agendaVisivel.find((a) => !a.realizada && a.dataProgramada >= HOJE);

  if (!carregado) {
    return (
      <div className="min-h-screen w-full flex items-center justify-center" style={{ backgroundColor: COR.bg, fontFamily: "'Inter', system-ui, sans-serif" }}>
        <img src={LOGO_ICONE} alt="PepPlot" className="w-12 h-12 rounded-2xl mb-3 opacity-80" />
        <p className="text-sm" style={{ color: COR.textoSecundario }}>Carregando seus dados…</p>
      </div>
    );
  }

  if (mostrarGuia) return <GuiaInicial onConcluir={concluirGuia} />;

  if (tela === "novoHormonio" && cicloAtivo) {
    return (
      <div className="min-h-screen w-full flex justify-center" style={{ backgroundColor: COR.bg, fontFamily: "'Inter', system-ui, sans-serif" }}>
        <TelaConfigurarHormonio cicloNome={cicloAtivo.nome} pesoCorporal={pesoAtual} onCancelar={() => setTela("ciclo")} onSalvar={handleSalvarNovoComposto} />
      </div>
    );
  }
  if (tela === "novoPeptideo" && cicloAtivo) {
    return (
      <div className="min-h-screen w-full flex justify-center" style={{ backgroundColor: COR.bg, fontFamily: "'Inter', system-ui, sans-serif" }}>
        <TelaConfigurarPeptideo cicloNome={cicloAtivo.nome} onCancelar={() => setTela("ciclo")} onSalvar={handleSalvarNovoComposto} />
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full flex justify-center" style={{ backgroundColor: COR.bg, fontFamily: "'Inter', system-ui, sans-serif" }}>
      <div className="w-full max-w-[430px] lg:max-w-[1100px] relative pb-24">
        {/* Cabeçalho com logo e marca */}
        <div className="px-5 pt-6 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <img src={LOGO_ICONE} alt="PepPlot" className="w-9 h-9 rounded-xl" />
            <div>
              <p className="text-[11px]" style={{ color: COR.textoSecundario }}>PepPlot</p>
              <h1 className="text-lg font-semibold -mt-0.5" style={{ color: COR.textoPrincipal }}>
                {abaAtiva === "calculadora" ? "Calculadora" : telaLarga ? "Painel" : abaAtiva === "grafico" ? "Gráfico" : "Meu ciclo"}
              </h1>
            </div>
          </div>
          <div className="flex flex-col items-end gap-1">
            <div className="flex items-center gap-2.5">
              <button onClick={handleExportarBackup} className="text-[11px] font-medium" style={{ color: COR.textoSecundario }}>Exportar</button>
              <button onClick={() => inputImportarRef.current?.click()} className="text-[11px] font-medium" style={{ color: COR.textoSecundario }}>Importar</button>
              <input ref={inputImportarRef} type="file" accept="application/json" className="hidden" onChange={(e) => e.target.files[0] && handleImportarBackup(e.target.files[0])} />
            </div>
            {!confirmandoReset ? (
              <button onClick={() => setConfirmandoReset(true)} className="text-[11px] font-medium" style={{ color: COR.textoSecundario }}>
                Reiniciar dados
              </button>
            ) : (
              <div className="flex items-center gap-1.5">
                <button onClick={() => setConfirmandoReset(false)} className="text-[11px] font-medium px-2 py-1 rounded-lg" style={{ backgroundColor: "#22252B", color: COR.textoPrincipal }}>Cancelar</button>
                <button onClick={handleReiniciarDados} className="text-[11px] font-medium px-2 py-1 rounded-lg" style={{ backgroundColor: COR.perdido, color: "#fff" }}>Confirmar</button>
              </div>
            )}
          </div>
        </div>
        {erroStorage && (
          <p className="px-5 mt-1 text-[11px]" style={{ color: COR.atraso }}>Não foi possível salvar suas últimas alterações. Verifique sua conexão.</p>
        )}

        {/* ================= ABA: MEU CICLO (somente cronograma/calendário) ================= */}
        <div className="lg:flex lg:gap-6 lg:px-5">
        {(abaAtiva === "ciclo" || (telaLarga && abaAtiva !== "calculadora")) && (
          <div className="px-5 lg:px-0 mt-4 lg:flex-1 lg:min-w-0">
            <div className="flex items-center gap-2 pb-1 overflow-x-auto no-scrollbar">
              {ciclos.filter((c) => !c.arquivado).map((c) => (
                <button key={c.id} onClick={() => { setCicloAtivoId(c.id); setEditandoNome(false); }} className="text-xs font-medium px-3.5 py-2 rounded-full whitespace-nowrap shrink-0 transition-colors" style={{ backgroundColor: c.id === cicloAtivoId ? COR.acentoReal : "#22252B", color: c.id === cicloAtivoId ? COR.bg : COR.textoSecundario, border: `1px solid ${c.id === cicloAtivoId ? COR.acentoReal : "transparent"}` }}>
                  {c.nome}
                </button>
              ))}
              <button onClick={criarCiclo} className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style={{ border: `1.5px dashed ${COR.borda}`, color: COR.textoSecundario }} aria-label="Criar novo ciclo">
                <Plus size={14} />
              </button>
            </div>

            {ciclos.some((c) => c.arquivado) && (
              <button onClick={() => setMostrarArquivados((v) => !v)} className="text-[11px] font-medium mt-1 mb-2" style={{ color: COR.textoSecundario }}>
                {mostrarArquivados ? "Ocultar" : "Ver"} ciclos encerrados ({ciclos.filter((c) => c.arquivado).length})
              </button>
            )}
            {mostrarArquivados && (
              <div className="flex flex-col gap-1.5 mb-3">
                {ciclos.filter((c) => c.arquivado).map((c) => (
                  <div key={c.id} className="flex items-center justify-between px-3.5 py-2 rounded-xl" style={{ backgroundColor: "#1E2126" }}>
                    <span className="text-xs" style={{ color: COR.textoSecundario }}>{c.nome}</span>
                    <button onClick={() => handleReativarCiclo(c.id)} className="text-[11px] font-medium" style={{ color: COR.acentoReal }}>Reativar</button>
                  </div>
                ))}
              </div>
            )}

            {!cicloAtivo && (
              <div className="flex flex-col items-center justify-center text-center px-4 py-16">
                <p className="text-sm font-medium mb-4" style={{ color: COR.textoSecundario }}>Você ainda não tem nenhum ciclo.</p>
                <button onClick={criarCiclo} className="text-sm font-medium px-5 py-3 rounded-xl" style={{ backgroundColor: COR.acentoReal, color: COR.bg }}>Criar ciclo</button>
              </div>
            )}

            {cicloAtivo && (
              <>
                <div className="flex items-center justify-between pt-3 pb-3">
                  {editandoNome ? (
                    <input ref={inputNomeRef} value={nomeTemp} onChange={(e) => setNomeTemp(e.target.value)} onBlur={salvarNomeCiclo} onKeyDown={(e) => e.key === "Enter" && salvarNomeCiclo()} className="text-lg font-semibold bg-transparent border-b w-full" style={{ color: COR.textoPrincipal, borderColor: COR.acentoReal }} autoFocus />
                  ) : (
                    <div className="flex items-center gap-2 min-w-0">
                      <h2 className="text-lg font-semibold truncate" style={{ color: COR.textoPrincipal }}>{cicloAtivo.nome}</h2>
                      <button onClick={() => { setNomeTemp(cicloAtivo.nome); setEditandoNome(true); }} aria-label="Editar nome do ciclo" className="shrink-0">
                        <Pencil size={13} style={{ color: COR.textoSecundario }} />
                      </button>
                    </div>
                  )}
                  {!editandoNome && (
                    <div className="flex items-center gap-2 shrink-0">
                      {aderencia != null && (
                        <span className="text-[11px] font-medium px-2 py-0.5 rounded-full" style={{ color: aderencia >= 80 ? COR.acentoReal : COR.atraso, backgroundColor: aderencia >= 80 ? COR.acentoRealClaro : COR.atrasoClaro }}>
                          Aderência: {aderencia}%
                        </span>
                      )}
                      <button onClick={handleEncerrarCiclo} className="text-[11px] font-medium" style={{ color: COR.textoSecundario }}>Encerrar ciclo</button>
                    </div>
                  )}
                </div>

                {cicloAtivo.itens.length === 0 ? (
                  <div className="rounded-2xl p-8 text-center" style={{ border: `1px dashed ${COR.borda}` }}>
                    <p className="text-sm" style={{ color: COR.textoSecundario }}>Nenhum composto neste ciclo ainda. Use o botão <strong>+</strong> no canto inferior para adicionar o primeiro.</p>
                  </div>
                ) : (
                  <>
                    {proximaAplicacao && (() => {
                      const corProx = corPorItemId[proximaAplicacao.itemId];
                      const alvo = momentoAplicacao(proximaAplicacao);
                      const restanteMs = alvo.getTime() - agora.getTime();
                      const atrasado = restanteMs < 0;
                      return (
                        <div className="mb-4 px-4 py-3.5 rounded-2xl" style={{ backgroundColor: atrasado ? COR.perdidoClaro : `${corProx}1A` }}>
                          <div className="flex items-center gap-1.5">
                            <Clock size={13} style={{ color: atrasado ? COR.perdido : corProx }} />
                            <p className="text-[11px] font-medium" style={{ color: atrasado ? COR.perdido : corProx }}>
                              {atrasado ? "Aplicação atrasada há" : "Próxima aplicação em"}
                            </p>
                          </div>
                          <p className="text-2xl font-bold tabular-nums mt-1" style={{ color: atrasado ? COR.perdido : corProx }}>
                            {formatarTempoRestante(restanteMs)}
                          </p>
                          <p className="text-[11px] mt-0.5" style={{ color: COR.textoSecundario }}>
                            {proximaAplicacao.compostoNome} · {formatarNumeroBR(proximaAplicacao.doseExibicao)}{proximaAplicacao.unidadeExibicao} · {formatarDataCurta(proximaAplicacao.dataProgramada)} às {proximaAplicacao.horario || "08:00"}
                          </p>
                        </div>
                      );
                    })()}

                    <p className="text-[11px] font-medium mb-3" style={{ color: COR.textoSecundario }}>Calendário de aplicações:</p>
                    <div className="flex flex-col gap-2">
                      {agendaVisivel.map((a) => (
                        <CardAplicacao key={a.id} agendamento={a} posicao={a.posicao} hoje={HOJE} cor={corPorItemId[a.itemId]} onMarcarNoHorario={handleMarcarNoHorario} onAbrirModalAtraso={setModalAtraso} onPedirDesfazer={setModalDesfazer} />
                      ))}
                    </div>
                  </>
                )}
              </>
            )}
          </div>
        )}

        {/* ================= ABA: GRÁFICO (visão aplicada + compostos do ciclo) ================= */}
        {(abaAtiva === "grafico" || (telaLarga && abaAtiva !== "calculadora")) && (
          <div className="px-5 lg:px-0 mt-4 lg:flex-1 lg:min-w-0">
            {!cicloAtivo ? (
              <div className="flex flex-col items-center justify-center text-center px-4 py-16">
                <p className="text-sm font-medium" style={{ color: COR.textoSecundario }}>Nenhum ciclo ativo. Crie ou selecione um na aba "Meu ciclo".</p>
              </div>
            ) : (
              <>
                <CardPeso pesos={pesos} alturaCm={alturaCm} onRegistrar={() => setModalPesoAberto(true)} />

                {cicloAtivo.itens.length === 0 ? (
                  <div className="rounded-2xl p-8 text-center" style={{ border: `1px dashed ${COR.borda}` }}>
                    <p className="text-sm" style={{ color: COR.textoSecundario }}>Nenhum composto neste ciclo ainda.</p>
                  </div>
                ) : (
                  <>
                    <div className="flex flex-col gap-2 mb-4">
                      {cicloAtivo.itens.map((item) => {
                        const custoInfo = calcularCustoItem(item);
                        const estoqueInfo = calcularEstoqueItem(item);
                        const cor = corPorItemId[item.id];
                        return (
                          <div key={item.id} className="flex items-center gap-3 py-2.5 px-3.5 rounded-2xl" style={{ backgroundColor: "#1E2126", borderLeft: `3px solid ${cor}` }}>
                            <div className="flex-1 min-w-0">
                              <p className="text-sm font-medium truncate" style={{ color: COR.textoPrincipal }}>{item.compostoNome}</p>
                              <p className="text-[11px] flex items-center gap-1 flex-wrap" style={{ color: COR.textoSecundario }}>
                                <Tag size={10} /> {item.marca || "Sem marca"}
                                {custoInfo && <><span className="mx-0.5">·</span><Wallet size={10} /> R$ {formatarBRL(custoInfo.custoPorDose)}/dose</>}
                              </p>
                              {estoqueInfo && (
                                <p className="text-[11px] mt-0.5" style={{ color: estoqueInfo.baixoEstoque ? COR.atraso : COR.textoSecundario }}>
                                  {estoqueInfo.dosesRestantesEstoque > 0
                                    ? `${estoqueInfo.dosesRestantesEstoque} dose(s) restantes · esgota em ${formatarDataCurta(estoqueInfo.dataEsgotamento)}`
                                    : "Estoque esgotado"}
                                </p>
                              )}
                            </div>
                            <button onClick={() => setItemEditando(item)} className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style={{ backgroundColor: COR.card, border: `1px solid ${COR.borda}` }} aria-label="Editar composto">
                              <Pencil size={13} style={{ color: cor }} />
                            </button>
                          </div>
                        );
                      })}
                    </div>

                    {itensHormonio.length > 0 && <div className="mb-4"><CardNivelHormonios itens={itensHormonio} periodo={periodo} setPeriodo={setPeriodo} hoje={HOJE} pesoCorporal={pesos.length > 0 ? pesos : 70} exames={cicloAtivo.exames || []} onAdicionarExame={() => setModalExameAberto(true)} /></div>}
                    <CardSintomas sintomas={cicloAtivo.sintomas || []} hoje={HOJE} onRegistrar={() => setModalSintomaAberto(true)} onExcluir={handleExcluirSintoma} />

                    {itensPeptideo.length > 0 && <div className="mb-4"><CardNivelPeptideos pontosGrafico={pontosPeptideo} periodo={periodo} setPeriodo={setPeriodo} hoje={HOJE} /></div>}
                  </>
                )}
              </>
            )}
          </div>
        )}

        {/* ================= ABA: CALCULADORA ================= */}
        </div>

        {abaAtiva === "calculadora" && (
          <div className="px-5 mt-4 lg:max-w-[640px] lg:mx-auto">
            <div className="flex gap-1 p-1 rounded-xl mb-3" style={{ backgroundColor: "#1E2126" }}>
              {[{ valor: "peptideos", label: "Peptídeos" }, { valor: "hormonios", label: "Hormônios" }].map((op) => (
                <button key={op.valor} onClick={() => setModoCalculadora(op.valor)} className="flex-1 text-sm font-medium py-2 rounded-lg transition-colors" style={{ backgroundColor: modoCalculadora === op.valor ? COR.card : "transparent", color: modoCalculadora === op.valor ? COR.textoPrincipal : COR.textoSecundario }}>
                  {op.label}
                </button>
              ))}
            </div>
            <div className="rounded-3xl p-4" style={{ backgroundColor: COR.card, border: `1px solid ${COR.borda}` }}>
              {modoCalculadora === "peptideos" ? <CalculadoraDiluicaoPeptideos /> : <CalculadoraAspiracaoHormonios />}
            </div>
          </div>
        )}

        {/* FAB — só na aba Meu Ciclo, com um ciclo ativo */}
        {abaAtiva === "ciclo" && cicloAtivo && (
          <div className="fixed bottom-24 right-1/2 translate-x-[calc(215px-3.5rem)]">
            {fabAberto && (
              <div className="absolute bottom-16 right-0 w-56 rounded-2xl overflow-hidden" style={{ backgroundColor: COR.card, border: `1px solid ${COR.borda}`, boxShadow: "0 12px 24px rgba(0,0,0,0.12)" }}>
                <button className="w-full flex items-center gap-3 px-4 py-3.5 text-left" onClick={() => { setFabAberto(false); setTela("novoHormonio"); }}>
                  <Syringe size={16} style={{ color: COR.acentoReal }} />
                  <span className="text-sm font-medium" style={{ color: COR.textoPrincipal }}>Adicionar hormônio</span>
                </button>
                <div className="h-px" style={{ backgroundColor: COR.borda }} />
                <button className="w-full flex items-center gap-3 px-4 py-3.5 text-left" onClick={() => { setFabAberto(false); setTela("novoPeptideo"); }}>
                  <FlaskConical size={16} style={{ color: COR.acentoPeptideo }} />
                  <span className="text-sm font-medium" style={{ color: COR.textoPrincipal }}>Adicionar peptídeo</span>
                </button>
              </div>
            )}
            <button onClick={() => setFabAberto((v) => !v)} className="w-14 h-14 rounded-full flex items-center justify-center active:scale-95 transition-transform" style={{ backgroundColor: COR.acentoReal, boxShadow: `0 8px 24px ${COR.acentoReal}55` }}>
              {fabAberto ? <X size={22} color={COR.bg} /> : <Plus size={22} color={COR.bg} />}
            </button>
          </div>
        )}

        {toast && <div className="fixed bottom-24 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl text-xs font-medium z-40" style={{ backgroundColor: "#22252B", color: COR.textoPrincipal, border: `1px solid ${COR.borda}`, maxWidth: 380 }}>{toast}</div>}

        {modalAtraso && <ModalConfirmarData agendamento={modalAtraso} posicao={modalAtraso.posicao} hoje={HOJE} onConfirmar={handleConfirmarAtraso} onFechar={() => setModalAtraso(null)} />}
        {modalDesfazer && <ModalDesfazerCheckin agendamento={modalDesfazer} posicao={modalDesfazer.posicao} onConfirmar={handleConfirmarDesfazer} onFechar={() => setModalDesfazer(null)} />}
        {modalSitio && <ModalSitio agendamento={modalSitio.agendamento} itens={cicloAtivo?.itens ?? []} hoje={HOJE} onConfirmar={handleConfirmarSitio} onFechar={() => setModalSitio(null)} />}
        {modalSintomaAberto && <ModalSintoma hoje={HOJE} onSalvar={handleSalvarSintoma} onFechar={() => setModalSintomaAberto(false)} />}
        {modalPesoAberto && <ModalPeso hoje={HOJE} alturaCm={alturaCm} onSalvar={handleSalvarPeso} onFechar={() => setModalPesoAberto(false)} />}
        {modalExameAberto && <ModalExame hoje={HOJE} onSalvar={handleSalvarExame} onFechar={() => setModalExameAberto(false)} />}
        {itemEditando && <ModalEditarComposto item={itemEditando} onSalvar={handleSalvarEdicaoComposto} onExcluir={handleExcluirComposto} onFechar={() => setItemEditando(null)} />}

        {/* Barra de navegação inferior */}
        <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] lg:max-w-[1100px] flex items-stretch" style={{ backgroundColor: COR.card, borderTop: `1px solid ${COR.borda}` }}>
          {(telaLarga
            ? [
                { key: "ciclo", label: "Painel", icone: CalendarDays },
                { key: "calculadora", label: "Calculadora", icone: FlaskConical },
              ]
            : [
                { key: "calculadora", label: "Calculadora", icone: FlaskConical },
                { key: "ciclo", label: "Meu ciclo", icone: CalendarDays },
                { key: "grafico", label: "Gráfico", icone: TrendingUp },
              ]
          ).map((aba) => {
            const Icone = aba.icone;
            const ativa = telaLarga && aba.key === "ciclo" ? abaAtiva !== "calculadora" : abaAtiva === aba.key;
            return (
              <button key={aba.key} onClick={() => setAbaAtiva(aba.key)} className="flex-1 flex flex-col items-center gap-1 py-3">
                <Icone size={20} style={{ color: ativa ? COR.acentoReal : COR.textoSecundario }} />
                <span className="text-[10px] font-medium" style={{ color: ativa ? COR.acentoReal : COR.textoSecundario }}>{aba.label}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById("root")).render(<TelaMeuCiclo />);
  </script>
</body>
</html>
